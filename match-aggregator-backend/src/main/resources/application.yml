spring:
  application:
    name: match-aggregator

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/match_aggregator}
    username: ${SPRING_DATASOURCE_USERNAME:match_aggregator_app}
    password: ${SPRING_DATASOURCE_PASSWORD:ChangeMe123!MatchAggregator}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:match-aggregator}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}

  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL}
    name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
    password: ${BOOTSTRAP_ADMIN_PASSWORD}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}

  permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:false}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
