<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Match Aggregator Frontend</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f6fb; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1e293b; text-align: center; margin-bottom: 25px; }
        .login-box { display: flex; flex-direction: column; gap: 15px; max-width: 300px; margin: 0 auto; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
        button { padding: 10px 15px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        button.danger { background: #dc2626; }
        button.danger:hover { background: #b91c1c; }
        button.success { background: #10b981; }
        button.success:hover { background: #059669; }
        button.small { padding: 6px 10px; font-size: 12px; }
        .top-panel { display: flex; justify-content: space-between; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; font-size: 13px; }
        tr:hover { background: #f8fafc; }
        .analytics { display: flex; gap: 20px; margin-bottom: 25px; background: #e0f2fe; padding: 15px; border-radius: 10px; flex-wrap: wrap; }
        .analytics-item { background: white; padding: 15px; border-radius: 8px; flex: 1; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .analytics-value { font-size: 24px; font-weight: bold; color: #2563eb; display: block; margin-bottom: 5px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; padding: 25px; border-radius: 12px; width: 500px; max-width: 90%; display: flex; flex-direction: column; gap: 12px; }
        .modal h3 { margin: 0 0 10px 0; color: #1e293b; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .hidden { display: none !important; }
        #error { color: #dc2626; text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Агрегатор матчей (Панель управления)</h1>
        <div id="error"></div>

        <div id="login-section" class="login-box">
            <h3 style="text-align: center;">Вход в систему</h3>
            <input type="email" id="email" placeholder="admin@match.local" value="admin@match.local">
            <input type="password" id="password" placeholder="Пароль" value="Admin123!ChangeMe">
            <button onclick="login()">Войти</button>
        </div>

        <div id="matches-section" class="hidden">
            <div class="top-panel">
                <button class="danger" onclick="logout()">Выйти</button>
                <button class="success" onclick="openModal()">+ Добавить матч</button>
            </div>

            <div class="analytics" id="analytics-block">
                <div class="analytics-item"><span class="analytics-value" id="stat-total">0</span>Всего матчей</div>
                <div class="analytics-item"><span class="analytics-value" id="stat-active">0</span>Активных</div>
                <div class="analytics-item"><span class="analytics-value" id="stat-important">0</span>Важных</div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Команда 1</th>
                        <th>Команда 2</th>
                        <th>Турнир</th>
                        <th>Счёт</th>
                        <th>Дата</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="matches-body"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-title">Новый матч</h3>
            <input type="hidden" id="match-id">
            <input type="hidden" id="match-version">
            <label>Команда 1:</label><input type="text" id="team1">
            <label>Команда 2:</label><input type="text" id="team2">
            <label>Турнир:</label>
            <select id="tournament-id"></select>
            <label>Дата и время:</label><input type="datetime-local" id="match-date">
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;"><label>Счёт 1:</label><input type="number" id="score1" value="0"></div>
                <div style="flex: 1;"><label>Счёт 2:</label><input type="number" id="score2" value="0"></div>
            </div>
            <div class="modal-actions">
                <button class="danger" onclick="closeModal()">Отмена</button>
                <button class="success" onclick="saveMatch()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        let accessToken = null;
        let tournaments = [];

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            document.getElementById('error').innerText = '';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) throw new Error('Неверный логин или пароль');
                const data = await res.json();
                accessToken = data.accessToken;

                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('matches-section').classList.remove('hidden');
                
                await loadTournaments();
                loadData();
            } catch (err) {
                document.getElementById('error').innerText = err.message;
            }
        }

        async function loadTournaments() {
            const res = await fetch('/api/references/tournaments', {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            if (res.ok) {
                tournaments = await res.json();
                const select = document.getElementById('tournament-id');
                select.innerHTML = '';
                tournaments.forEach(t => {
                    select.innerHTML += `<option value="${t.id}">${t.name}</option>`;
                });
            }
        }

        async function loadData() {
            const tbody = document.getElementById('matches-body');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Загрузка...</td></tr>';

            try {
                // Грузим только НЕ архивные матчи, чтобы таблица не забивалась мусором
                const resMatches = await fetch('/api/items?size=50&archived=false', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                const data = await resMatches.json();
                
                const resAnalytics = await fetch('/api/analytics/summary', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                const analytics = await resAnalytics.json();
                
                document.getElementById('stat-total').innerText = analytics.totalMatches;
                document.getElementById('stat-active').innerText = analytics.activeMatches;
                document.getElementById('stat-important').innerText = analytics.importantMatches;

                tbody.innerHTML = '';
                if (data.content.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Активных матчей нет</td></tr>';
                    return;
                }

                data.content.forEach(m => {
                    // m.matchDate приходит как строка ISO, переводим в читаемый вид
                    const date = new Date(m.matchDate).toLocaleString('ru-RU');
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${m.team1}</b></td>
                            <td><b>${m.team2}</b></td>
                            <td>${m.tournamentName}</td>
                            <td style="text-align:center; font-weight:bold;">${m.score1} : ${m.score2}</td>
                            <td>${date}</td>
                            <td>
                                <button class="small" onclick="openModal('${m.id}')">Ред.</button>
                                <button class="small danger" onclick="deleteMatch('${m.id}')">В архив</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;">Ошибка: ${err.message}</td></tr>`;
            }
        }

        async function openModal(id = null) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('match-id').value = '';
            document.getElementById('match-version').value = '0';
            
            if (!id) {
                // Создание
                document.getElementById('modal-title').innerText = 'Новый матч';
                document.getElementById('team1').value = '';
                document.getElementById('team2').value = '';
                document.getElementById('score1').value = 0;
                document.getElementById('score2').value = 0;
                
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('match-date').value = now.toISOString().slice(0, 16);
                
                if(tournaments.length > 0) document.getElementById('tournament-id').value = tournaments[0].id;
            } else {
                // Редактирование — тянем данные с сервера!
                document.getElementById('modal-title').innerText = 'Загрузка...';
                try {
                    const res = await fetch(`/api/items/${id}`, {
                        headers: { 'Authorization': 'Bearer ' + accessToken }
                    });
                    const m = await res.json();
                    
                    document.getElementById('modal-title').innerText = 'Редактировать матч';
                    document.getElementById('match-id').value = m.id;
                    document.getElementById('match-version').value = m.version; // ОЧЕНЬ ВАЖНО
                    document.getElementById('team1').value = m.team1;
                    document.getElementById('team2').value = m.team2;
                    document.getElementById('tournament-id').value = m.tournamentId;
                    document.getElementById('score1').value = m.score1;
                    document.getElementById('score2').value = m.score2;
                    
                    // Конвертируем ISO строку в формат для input type="datetime-local"
                    const d = new Date(m.matchDate);
                    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                    document.getElementById('match-date').value = d.toISOString().slice(0, 16);
                } catch (e) {
                    alert("Не удалось загрузить данные матча");
                    closeModal();
                }
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        async function saveMatch() {
            const id = document.getElementById('match-id').value;
            const isEdit = id !== '';
            
            const payload = {
                tournamentId: document.getElementById('tournament-id').value,
                team1: document.getElementById('team1').value,
                team2: document.getElementById('team2').value,
                matchDate: new Date(document.getElementById('match-date').value).toISOString(),
                status: "SCHEDULED",
                stage: "GROUP",
                score1: parseInt(document.getElementById('score1').value),
                score2: parseInt(document.getElementById('score2').value),
                priority: 5,
                isImportant: false
            };

            if (isEdit) {
                payload.version = parseInt(document.getElementById('match-version').value); // Отправляем реальную версию
            }

            const url = isEdit ? `/api/items/${id}` : '/api/items';
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 
                        'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Ошибка при сохранении (проверьте поля)');
                }
                
                closeModal();
                loadData(); // Обновляем таблицу
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteMatch(id) {
            if (!confirm('Отправить матч в архив?')) return;
            try {
                const res = await fetch(`/api/items/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                // Если сервер вернул ошибку, покажем ее
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Ошибка удаления');
                }
                loadData();
            } catch (err) {
                alert(err.message);
            }
        }

        function logout() {
            accessToken = null;
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('matches-section').classList.add('hidden');
        }
    </script>
</body>
</html>
