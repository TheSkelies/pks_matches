services:
  # ==========================================
  # База данных PostgreSQL 16
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: pks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pks_matches
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Постоянное хранилище базы
      - pgdata:/var/lib/postgresql/data
      # Автоматическое применение schema.sql при первом запуске контейнера!
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pks_matches"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 1. Фронтенд (JavaFX GUI) через встроенный Web/noVNC
  # Запуск: docker compose up app-gui
  # Открыть в браузере: http://localhost:8080/vnc.html
  # ==========================================
  app-gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
    container_name: pks-app-gui
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/pks_matches
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080" # noVNC веб-доступ к графическому окну
      - "5900:5900" # Прямой VNC порт (опционально)

  # ==========================================
  # 2. Консольная версия (CLI)
  # Запуск: docker compose run --rm app
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pks-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/pks_matches
      DB_USER: postgres
      DB_PASSWORD: postgres
    stdin_open: true
    tty: true

volumes:
  pgdata:
